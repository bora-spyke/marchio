<body>
<canvas id="game"></canvas>
<script>
'use strict';

/* ================================================================
   NEONLOOP (eski adı: Neon İlmek) — "Neon Fill + Archero" prototipi
   Çekirdek mekanik: düşmanları kovalarken/kaçarken bir Draw düğmesi
   basılı tutulur, oyuncu hareket ettikçe parlayan bir iz bırakır;
   iz kendi başlangıç noktasına değince kapanır ve içindeki tüm
   düşmanlara alan bazlı hasar verir. Paper.io'nun aksine bölge
   KALICI DEĞİL — sadece anlık bir saldırı.
   Modüller (tek dosyada, ama işlevsel olarak ayrık — bkz. yorum
   başlıkları): PlayerController, TrailDrawer/LoopDetector,
   PolygonUtility, LoopAttack, EnemyBase+Spawner, ProjectileSystem,
   UpgradeManager, WaveManager, GameManager.

   v0.7 DEĞİŞİKLİĞİ (bu dosya): Electric Border yükseltmesindeki buğ
   düzeltildi. Eski formülde `S.upgrades.electricBorder / Math.max(1,
   S.upgrades.electricBorder)` her zaman 1'e sadeleşiyordu — yani
   yükseltmeyi 2. veya 3. kez alsan da HİÇBİR ŞEY değişmiyordu.
   Design doc v1.1 kararı: her ek seviye MENZİLİ büyütsün, hasar
   yüzdesini değil (dengeyi bozmasın diye). Bkz. CONFIG.electricBorderRadiusStep
   ve closeLoop() içindeki Electric Border bloğu. Ayrıca HUD'daki aktif
   yükseltme listesine Electric Border için güncel menzili (px) yazıldı,
   ve menzil içinde kalıp da SADECE border'dan hasar alan düşmanlara
   ayrı renkte (elektrik sarısı) bir parçacık patlaması eklendi — böylece
   oyuncu üst üste yükseltme alınca menzilin gerçekten büyüdüğünü hem
   HUD'dan okuyabilir hem de sahnede görebilir.

   v0.8 DEĞİŞİKLİĞİ (bu dosya):
   1) İsim: "Neon İlmek" → "NeonLoop" (başlık + menü ekranı).
   2) Fare/dokunmatik takibi sıkılaştırıldı — "karakter mouse'un çok
      gerisinden geliyor" geri bildirimi üzerine oyuncu hızı ve ivmesi
      artırıldı (220→320 px/s, ivme 1600/2000→2300/2900 px/s²) ki imleç
      hızlı hareket ettirilince aradaki boşluk gözle görülür şekilde
      kapansın. Çekirdek ilmek/hasar sayıları DEĞİŞMEDİ — bu saf bir
      "kontrol hissi" ayarı, dengeyi ilmek tarafında bozmuyor ama
      oyuncu artık biraz daha çevik/kaçış gücü yüksek, playtest'te
      hissedilirse geri ayarlanabilir (bkz. CONFIG.playerSpeed).
   3) Ateş gücü artırıldı: autoAttackDamage 10→18, autoAttackCooldownMs
      550→450 (daha güçlü VE daha sık ateş). Not: bu sistem tasarım
      dokümanında bilerek "zayıf/ikincil" tutulmuştu ki ilmek asıl hasar
      kaynağı kalsın — bu değişiklik kullanıcı talebiyle bilinçli bir
      denge kararı, playtest'te ilmek önemini kaybediyorsa geri kısılabilir.

   v0.9 DEĞİŞİKLİĞİ (bu dosya):
   1) Ateş gücü ince ayar: autoAttackDamage 18→13 (aşağı çekildi),
      autoAttackCooldownMs 450'de SABİT kalıyor — sadece hasar
      değişti, ateş sıklığına dokunulmadı.
   2) Neon iz (ilmek) uzunluk limiti %15 artırıldı: maxLoopLengthMult
      16→18.4, yani başlangıç limiti ~480px'den ~552px'e çıktı
      (oyuncu genişliğinin 16 katından 18.4 katına). Büyüme formülü
      (her 3 xp'de +%6) aynı kalıyor, sadece taban değer büyüdü.

   Kullanıcı isteği: "loop hem daire içine alıp öldürsün hem de tuzak
   kursun". Artık bir ilmek kapandığında, o anlık alan hasarına EK
   OLARAK, kapanan şeklin kendisi CONFIG.barrierDurationMs (3 sn) kadar
   yerde SOLİD bir bariyer olarak kalıyor — düşmanlar (hem hareketleri
   hem mermileri) bu çizgiyi geçemiyor, oyuncu serbestçe içinden geçebiliyor.
   NOT: Bu, dosyanın en tepesindeki eski "Paper.io'nun aksine bölge
   KALICI DEĞİL" notunu kısmen değiştiriyor — artık şekil birkaç saniye
   kalıyor, ama Paper.io'daki gibi alan/skor SAHİPLENMİYOR, sadece
   geçici bir fiziksel engel. Bkz. S.barriers, resolveEnemyBarrierCollision(),
   segmentsIntersect(). Süre dolmaya yaklaşınca (son %25) çizgi yanıp
   sönerek kaybolacağını haber veriyor.
   Denge notu: kombo + bariyer birlikte oyuncuyu hem saldırıda hem
   savunmada güçlendiriyor — playtest'te sonraki dalgalar çok kolaylaşırsa
   önce bariyer süresini kısaltın (3sn→2sn), sonra aynı anda kaç bariyerin
   aktif olabileceğine bir tavan koyun.

   v0.10 DEĞİŞİKLİĞİ (bu dosya) — KOMBO SİSTEMİ (yeni):
   S.maxLoopLength hâlâ öldürdükçe KALICI büyüyor (değişmedi). Üstüne
   şimdi bir KOMBO sayacı eklendi: bir ilmek kapanışında içeri giren
   her düşman kombo'yu 1 artırır (aynı count değeri multi-kill
   bonusunda da kullanılıyor). Kombo arttıkça GEÇİCİ olarak izin
   izin verilen uzunluğu büyütür (bkz. effectiveMaxLoopLength() —
   %10/kombo, tavan +%150). Oyuncu HASAR ALDIĞI ANDA kombo VE bu
   geçici uzama sıfıra döner — kalıcı (XP) büyüme etkilenmez, sadece
   kombo bonusu sıfırlanır. HUD'da "KOMBO xN" olarak gösteriliyor,
   kombo artışında yükselen bir "combo up" sesi, sıfırlanmasında
   düşen bir "combo break" sesi çalıyor.

   v0.12 DEĞİŞİKLİĞİ (bu dosya) — TEK ELLE MOBİL KONTROL:
   Sorun: "double-tap ile çizimi aç/kapat" hareket ederken tek elle
   (metroda, tek başparmakla) zamanlaması zor bir ikinci jestti. Çözüm:
   ÇİFT DOKUNMA KALDIRILDI. Artık parmağın ekranda olduğu HER an otomatik
   olarak çiziyor — tek sürekli sürükleme hem hareket hem çizim. Böylece
   tek elle tek başparmakla oynanabilir. Parmağını kaldırıp (başparmağın
   rahat ulaşamadığı bir yerden) yakın bir yere tekrar koyduğunda iz hemen
   iptal olmasın diye CONFIG.touchReleaseGraceMs (180ms) kadar bir "af
   süresi" var — bu pencere içinde tekrar dokunursan iz kaldığı yerden
   devam eder, pencere dolarsa gerçekten bırakılmış sayılır ve iptal olur.
   Bkz. computeInput(dt) — artık dt alıyor, touchReleaseGraceMsLeft modül
   değişkeni. Masaüstü (klavye/fare) kontrolleri DEĞİŞMEDİ.

   v0.13 DEĞİŞİKLİĞİ (bu dosya) — GERÇEK PLAYTEST GERİ BİLDİRİMİ:
   "Bastığın yere gitme" (parmağın DOKUNDUĞU MUTLAK NOKTAYA gitme) kötü
   hissettiriyordu. Dokunmatik hareket artık ARCHERO TARZI DİNAMİK JOYSTICK:
   parmağın ekrana ilk değdiği yer joystick'in merkezi (origin) olur, oyuncu
   parmağı o merkezden ne kadar/ne yöne uzaklaştırdığına göre hareket eder
   (mutlak konum değil, GÖRELİ yön+mesafe). Böylece başparmak ekranın
   HERHANGİ bir yerine rahatça konabilir — tek elle konfor sorunu da ayrıca
   çözülmüş olur. Bkz. touches Map'teki {ox,oy} (origin) alanları,
   CONFIG.joystickRadius, S.touchTargetVisual'ın yeni {originX,originY,curX,curY} şekli.
   Ayrıca:
   1) Kuyruk her zaman bırakılıyor (v0.12'den beri aynı, değişmedi).
   2) Parmak kalkınca iz artık ANINDA değil, CONFIG.touchReleaseGraceMs
      SÜRESİ SONUNDA kesiliyor — bu süre 180ms'den 1000ms'e (1 sn)
      çıkarıldı: "parmağı kaldırınca 1 saniyede kessin o kuyruğu, kapanmasa
      bile" isteği. Mekanizma aynı (bkz. v0.12 notu), sadece süre değişti.
   3) SABİT ARENA/KENAR KALDIRILDI — artık Archero'daki gibi sınırsız bir
      dünyada hareket ediliyor. Kamera oyuncuyu MERKEZDE tutuyor (S.camera =
      oyuncunun dünya konumu), her şey (düşman, mermi, ilmek, bariyer) artık
      DÜNYA koordinatında saklanıyor, render() bir kez ctx.translate ile
      dünyayı ekrana kaydırıyor — HUD ve overlay'ler bu translate'in DIŞINDA,
      hep ekran-sabit kalıyor. Düşman spawn'ı artık sabit arena kenarına değil,
      oyuncuyu saran (ekranın biraz dışında) bir çembere göre hesaplanıyor
      (bkz. spawnPointOutsideArena — mantık aynı, referans noktası "arena"
      yerine "oyuncunun etrafındaki sanal görüş kutusu").
   4) Arkaplana göz yormayan, kamerayla birlikte kayan ince bir nokta-grid
      deseni eklendi (bkz. drawBackgroundPattern) — hareket hissi versin
      diye, dikkat dağıtmasın diye çok düşük alfa ile.

   v0.14 DEĞİŞİKLİĞİ (bu dosya):
   1) KRİTİK BUĞ DÜZELTMESİ — "düşmanlar ve ben ateşi kesmişiz": mermi
      sınır-dışı-silme kontrolü (hem oyuncu hem düşman mermileri için)
      hâlâ ESKİ sabit-arena döneminden kalma 0..W / 0..H EKRAN aralığına
      bakıyordu. v0.13'te sınırsız harita/kamera gelince mermiler DÜNYA
      koordinatında saklanmaya devam etti (oyuncu merkezden uzaklaşınca
      bu koordinatlar kolayca 0..W/0..H dışına çıkar) — sonuç: oyuncu
      biraz hareket eder etmez HER mermi doğar doğmaz (görünmeden) siliniyor,
      hem oyuncunun otomatik atışı hem düşman atışları "hiç ateş etmiyormuş"
      gibi görünüyordu. Artık sınır kontrolü kameraya (oyuncuya) göre —
      S.camera.x/y ± W/2,H/2 — hesaplanıyor.
   2) Dokunmatik bırakma davranışı değişti: "hareketi bırakınca ilmek
      kesilsin ve 1 saniye sonra yeniden başlasın" isteğiyle, parmak
      kalkınca iz artık ANINDA iptal oluyor (v0.13'teki "1 sn açık tut,
      sonra kes" modeli kaldırıldı). Bunun yerine touchAutoResumeMs (1 sn)
      sonra parmak tekrar basılmasa BİLE iz kendiliğinden yeniden başlıyor.
      Parmak bu süre dolmadan tekrar basarsa zaten anında devam eder.
      Bkz. computeInput() — touchEngaged/wasTouching/touchAutoResumeCooldownLeft.
   3) Bariyerler artık sadece itmiyor, HASAR DA VERİYOR: "duran looplar
      hasar verecek çarparlarsa" isteğiyle resolveEnemyBarrierCollision artık
      temas eden düşmana CONFIG.barrierDps × dt kadar sürekli hasar uyguluyor
      (bkz. applyBarrierDamage) — 3 saniyelik bariyerin içinde/üstünde kalan
      bir düşman zamanla ciddi hasar alır, öldürebilir.
   4) Düşman yoğunluğu artırıldı: "düşman az geliyor sonsuz olunca ekran"
      geri bildirimiyle waveComposition() sayıları büyütüldü ve
      enemySpawnStaggerMs kısaltıldı (220→160ms) — sınırsız haritada dalga
      artık daha hızlı ve daha kalabalık sahneye giriyor.

   v0.15 DEĞİŞİKLİĞİ (bu dosya) — DENEME:
   "Parmağı kaldırınca hareket devam etsin ama ipi kessin, ip bağlanmamış
   da olsa kalsın (çizgi halinde kalsın)" isteğiyle iki ayrı davranış eklendi:
   1) HAREKET ARTIK DURMUYOR: v0.14'te parmak kalkınca hareket girdisi (mx,my)
      0'a dönüp oyuncu playerDecel ile yavaşlayıp duruyordu. Artık joystick'in
      SON uyguladığı yön/hız (lastTouchMx/lastTouchMy) saklanıyor ve parmak
      ekranda olmasa da hareket girdisi olarak kullanılmaya devam ediyor —
      yani karakter son gittiği yönde gitmeye devam ediyor, yeni bir dokunuş
      (veya joystick'i merkeze/deadzone'a getirip bırakmak) gelene kadar
      durmuyor. Bkz. computeInput() — artık her iki touch dalında da mx/my
      lastTouchMx/lastTouchMy'den besleniyor.
   2) KAPANMAMIŞ İZ ARTIK GÖRSEL OLARAK KALIYOR: cancelLoop('release') artık
      izi tamamen silmiyor — kesilen (bağlanmamış) iz, S.deadTrails'e salt
      görsel bir "kalıntı" olarak ekleniyor ve CONFIG.deadTrailMs (2.5 sn)
      boyunca sönerek ekranda kalıyor. ÖNEMLİ: bu bir bariyer DEĞİL — hasar
      vermiyor, düşmanı durdurmuyor, kapatılamıyor; sadece "az önce buradan
      geçtin" hissi veren dekoratif bir iz. 'limit' veya 'hit' sebebiyle
      iptal olan izler bu davranışa dahil değil (sadece 'release').
   NOT: Bu ikisi de bilinçli olarak "deneme" — playtest'te "hareketin hiç
   durmaması tuhaf/kontrolsüz hissettiriyor" ya da "kalıntı izler ekranı
   kirletiyor" gibi geri bildirim gelirse kolayca geri alınabilir/ayarlanabilir
   (bkz. CONFIG.deadTrailMs, lastTouchMx/lastTouchMy mantığı).

   v0.16 DEĞİŞİKLİĞİ (bu dosya):
   Geri bildirim: "çevreleyince hepsi salak gibi bir yere toplanıyor üst üste,
   sen de çevreliyorsun birden 15 kişi ölüyor — keyifli ama çok basitleştiriyor,
   bazıları o kadar aynı hareketi yapmasın, bi randomluk olsun." Sorunun kökü:
   chaser/fast düşmanlar oyuncuya SAF doğrusal vektörle koşuyordu — dolayısıyla
   hepsi tam olarak aynı noktaya (oyuncunun üstüne) yığılıyordu, tek bir orta
   loop 15 düşmanı birden yakalayabiliyordu. Çekirdek mekanik (çevrele-kapat)
   AYNEN kalıyor, sadece düşman HAREKETİNE kişisel rastgelelik eklendi:
   1) `steerJitter` — her düşman doğduğunda ±23° (CONFIG.enemySteerJitterRad)
      arası SABİT bir açı sapması çekiyor; bu açı, oyuncuya giden yön
      vektörüne her karede uygulanıyor (bkz. update() — rdx/rdy rotasyonu).
      Sonuç: düşmanlar dümdüz değil, hafif eğri/farklı açılardan yaklaşıyor —
      artık hepsi aynı hareketi yapmıyor, oyuncunun etrafına YAYILARAK geliyor.
   2) `speedMult` — her düşman ±%20 (CONFIG.enemySpeedVariance) kişisel hız
      çarpanı çekiyor; aynı anda varmıyorlar, kümelenme zamanlama açısından da azalıyor.
   3) Ranged tipi de aynı jitter'ı VE kişisel bir `preferredDistJitter`
      (±40px) alıyor — hepsi aynı yarıçapta durmuyor.
   4) `applyEnemySeparation()` — üst üste binen (yarıçapları çakışan) düşmanları
      birbirinden hafifçe iten ikinci, ucuz bir katman (klasik boid separation);
      1-3 çoğu kümelenmeyi zaten önlüyor, bu sadece tam pixel-üstü çakışmaya
      karşı bir güvence. O(n²) ama jam ölçeğindeki düşman sayılarında ucuz.
   Node ile izole simülasyon testiyle doğrulandı: aynı 15 düşmanlık dalga,
   ESKİ modelde ortalama düşmanlar-arası mesafe ~1px'e (tam üst üste) inerken,
   YENİ modelde ~50px'e çıkıyor — hâlâ bir loop'la yakalanabilirler (mekanik
   bozulmadı) ama artık tek bir noktada mucizevi şekilde çakışmıyorlar.

   v0.17 DEĞİŞİKLİĞİ (bu dosya) — ART DIRECTION UYGULANDI:
   Ekibe gönderilen "NeonLoop Art Direction" sayfasındaki yön etütleri koda
   işlendi. RENKLER DEĞİŞMEDİ (hâlâ aynı CONFIG değerleri) — sadece siluetler
   ve HUD/kart çizimleri düz dairelerden/dikdörtgenlerden gerçek şekillere geçti:
   1) Düşmanlar artık tipe özgü siluetlerle çiziliyor: chaser 8 köşeli sivri
      bir "diken" (drawChaserShape), fast hareket yönüne bakan uzamış bir ok
      (drawFastShape — yönü her karede oyuncuya göre hesaplanıyor), ranged
      altıgen bir çerçeve + yavaşça dönen bir çekirdek noktası (drawRangedShape
      — dönüş salt görsel, performance.now()'a bağlı, gameplay'e dokunmuyor).
   2) Oyuncu artık "kuyruklu yıldız" (art-direction sayfasındaki A yönü — en
      garanti/en okunaklı seçenek): hıza göre uzayıp kısalan, hareket yönüne
      dönen yumuşak bir gradyan kuyruk (drawPlayerShape). B yönü (devre
      figürü) bilerek uygulanmadı — Spine'da gerçek iskelet gerektiriyor,
      animatör isterse ileride o yöne geçilebilir.
   3) HUD: can barı artık yuvarlak köşeli + neon glow dolgulu (roundRectPath
      yardımcı fonksiyonu — ctx.roundRect yoksa düz dikdörtgene düşer, hiç
      patlamaz). Kombo göstergesi düz metinden parlayan bir "chip"e döndü.
   4) Yükseltme kartları: düz dikdörtgen + ortalı metin yerine ince çerçeveli
      kart + sol tarafta parlayan bir kimlik rozeti (bkz. UPGRADE_ACCENT —
      YENİ renk YOK, sadece var olan CONFIG renklerinin yükseltmelere ataması).
   Hiçbir gameplay/denge sayısı değişmedi — bu turun tamamı salt görsel.

   v0.18 DEĞİŞİKLİĞİ (bu dosya):
   "Düşmanlar o şekilde olsun ama etraflarında daire olmasın ve büyükler biraz"
   isteğiyle üç düşman siluetinden (drawChaserShape/drawFastShape/
   drawRangedShape) yumuşak "hale" (glow halo) katmanı kaldırıldı — artık
   sadece keskin siluet çiziliyor, etraflarında bulanık bir daire yok. Aynı
   zamanda üçünün de görsel ölçeği ~%15-20 büyütüldü (chaser 1.55/0.62→1.85/
   0.72, fast ok 1.7→2.0, ranged altıgen 1.35→1.55, çekirdek noktalar da
   orantılı büyüdü). ÖNEMLİ: en.r (gerçek çarpışma/hitbox yarıçapı) DOKUNULMADI
   — büyüme salt görsel, hiçbir denge sayısı değişmedi.

   v0.19 DEĞİŞİKLİĞİ (bu dosya):
   1) BUĞ DÜZELTMESİ — Heal Fill çalışmıyordu: eski koşul `count >= 3` idi,
      yani "öldürünce" değil, "ilmeğin İÇİNDE en az 3 düşman OLUNCA" can
      veriyordu — 1-2 düşmanlık normal kapanışlarda (jam'in en sık senaryosu)
      hiç tetiklenmiyordu, bu yüzden "çalışmıyor" gibi hissettiriyordu.
      "ip içine alıp öldürünce 5 can versin" isteğiyle artık ilmek İÇİNDE
      en az 1 düşman GERÇEKTEN ÖLDÜRÜLÜNCE (3'ü değil) can veriyor — bkz.
      applyLoopDamage() artık öldürüp öldürmediğini true/false döndürüyor,
      closeLoop() bunu killedInside ile sayıyor. Miktar aynı kaldı (5 ×
      yükseltme seviyesi), sadece tetikleyici düzeltildi. Elektrik sınırından
      (border-only) gelen öldürmeler bu sayaca dahil değil — istek net şekilde
      "ip İÇİNE alıp" dediği için sadece ana poligon içi öldürmeler sayılıyor.
   2) YENİ — 3. dalga sonunda BOSS: "3. dalga sonuna bi boss tasarla kısıtlı
      alan olsun ama çok da kısıtlı değil" isteğiyle, dalga 3'ün normal
      düşmanları bitince (upgrade ekranından ÖNCE) tek seferlik bir boss
      karşılaşması araya giriyor (bkz. startBossFight(), updateBoss(),
      killEnemy()'deki boss dalı). Boss ölünce akış normale döner — dalga 3
      zaten her 3 dalgada bir gelen yükseltme ekranını tetiklediği için
      (CONFIG.upgradeEveryNWaves) boss sonrası doğal olarak yükseltme ekranı
      açılıyor, ekstra bir akış eklemeye gerek kalmadı.
      - Kısıtlı alan: S.bossArena = {x,y,r:CONFIG.bossArenaRadius} — boss
        tetiklenince oyuncunun O ANKİ konumu merkez alınıyor, hem oyuncu hem
        boss bu yarıçapı (820px, çap ~1640px) AŞAMIYOR (clampToBossArena).
        "Çok da kısıtlı değil" — bu çap, oyuncu hızının (320px/s) ~5 katı ve
        tipik ilmek çapının (~250-500px) 3-4 katı, yani manevra/kaçış için
        bolca yer var, sadece sınırsız dünyanın "boss'tan kaçıp sonsuza kadar
        kaçmak" seçeneği kapatılıyor. Sınır, dünya-uzayında ince kırmızımsı
        (CONFIG.hpBad) bir halka olarak çiziliyor ki oyuncu nerede olduğunu
        görsün.
      - Boss davranışı basit ama okunaklı bir durum makinesi (updateBoss):
        'chase' (yavaş takip, chaserSpeed'den daha yavaş) → attackTimer
        dolunca 'telegraph' (saldırı türüne göre ~450-550ms önceden UYARI —
        kırmızı büyüyen halka, kaçmaya yeten süre) → ya 'dash' (kilitlenmiş
        noktaya hızlı hamle, playerSpeed'in üstünde, temas hasarı normalden
        yüksek) ya da 'burst' (360° mermi patlaması, bariyerler bu mermileri
        de durdurabiliyor — mevcut sistemle bedava uyumluluk) → 'recover' →
        tekrar 'chase', bir dahaki sefer diğer saldırıya geçiyor (ikisi
        sırayla dönüyor, art arda aynı saldırı gelmiyor).
      - Boss da normal bir S.enemies elemanı (type:'boss') olduğu için ilmek
        hasarı, bariyer hasarı, otomatik ateş, yanma/donma yükseltmeleri,
        Heal Fill dahil HER ŞEY onun üzerinde de aynen çalışıyor — özel bir
        hasar sistemi YOK, sadece hareket/saldırı deseni ve temas hasarı
        (contactDamage alanı) özel.
      - Görsel: drawBossShape() — chaser ailesinden (aynı renk, CONFIG.chaser)
        ama büyük, 12 köşeli dönen bir "kristal", çekirdek CONFIG.hpBad
        (tehlike kırmızısı) — yeni renk EKLENMEDİ, var olan paletten. HUD'a
        boss canlı olduğu sürece görünen küçük bir "BOSS" can barı eklendi
        (renderHUD).
      - Denge notu: bossHP/bossDashSpeed/bossArenaRadius ilk tahmin — jam
        playtestinde "çok kolay/çok zor" geri bildirimi gelirse CONFIG'deki
        boss* değerlerinden ayarlanabilir, kod tarafı değişmez.

   v0.20 DEĞİŞİKLİĞİ (bu dosya):
   1) BUĞ DÜZELTMESİ — "İlmeğin boyutuna bir sınırlandırma getirelim, şu an
      sonsuza kadar uzuyor": öldürdükçe (xp) KALICI büyüyen taban ilmek
      uzunluğunun (S.maxLoopLength) hiçbir tavanı yoktu, sınırsız dalgada
      teorik olarak sonsuza büyüyordu. Artık CONFIG.maxLoopLengthGrowthCapMult
      (2.0×) ile taban uzunluk en fazla başlangıcının 2 katına kadar büyüyüp
      orada kilitleniyor (bkz. updateMaxLoopLength). Kombo bonusu (geçici,
      zaten kendi tavanına sahipti: +%150) bu tavanın üstüne hâlâ binebiliyor
      — yani mutlak en büyük ilmek hâlâ SONLU (taban×2.0×2.5 = 5×), ama artık
      gerçekten bir tavanı var.
   2) YENİ — Boss artık bariyerden (yerde kalan kapalı ilmek) hiç etkilenmiyor:
      "boss mermileri ve boss'un kendisi yerde kalan ilmekten etkilenmesin,
      daha korkunç olsun" isteğiyle boss'un GÖVDESİ artık
      resolveEnemyBarrierCollision()'a hiç girmiyor (ne duruyor ne hasar
      alıyor) ve boss'un MERMİLERİ (yeni `fromBoss` bayrağı) bariyer-durdurma
      kontrolünden muaf — düz geçip gidiyor. Normal düşmanlar/mermiler
      (chaser/fast/ranged) bariyerden hâlâ aynen etkileniyor, sadece boss
      istisna. Node harness ile aynı bariyerden aynı yolu geçen bir normal
      mermi ve bir boss mermisi karşılaştırılarak doğrulandı: normal mermi
      durduruluyor, boss mermisi aynen geçiyor.
   3) DENGE — "ilkini çok kolay geçtim, biraz daha zor olsun, atış gücü

      bossDashContactDamage 24→30, bossAttackCooldownMs 2600→2200 (saldırılar

   4) YENİ — Üçüncü boss saldırısı: TAKİP EDEN MERMİ (homing): "arada bir de
      takip eden mermi yollasın, iki saniye kadar takip edip sonra havada
      patlasın, iki saniye içinde vurursa da vurursun" isteğiyle eklendi.
      Boss artık üç saldırı arasında rastgele dönüyor (dash / burst / homing
      — bkz. pickNextBossAttack), aynısı ART ARDA gelmiyor. Takip mermisi

      bu süre içinde vurursa CONFIG.bossHomingDamage (16) hasar verir, süre

      Ekranda tehlike-kırmızısı (CONFIG.hpBad) renginde çizilerek normal

/* ============ RESIZE (DPR-aware; oyun koordinatları CSS piksel) ============ */
function resizeCanvas() {
  const w = window.visualViewport ? window.visualViewport.width : window.innerWidth;
  const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = w; H = h;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // v0.13: sabit arena kaldırıldı — dünya sınırsız, kamera oyuncuyu merkezde tutuyor
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 100));
