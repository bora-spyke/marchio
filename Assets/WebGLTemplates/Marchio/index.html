<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{{ PRODUCT_NAME }}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05070d">
<link rel="icon" type="image/png" href="TemplateData/icon.png">
<link rel="apple-touch-icon" href="TemplateData/icon.png">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    position: fixed; inset: 0; overflow: hidden;
    background: #05070d; color: #eaf6ff;
    font-family: system-ui, sans-serif;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #unity-canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; background: #05070d; }
  #loading {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end; gap: 14px; background: #05070d url("TemplateData/splash.png") center / cover no-repeat;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 48px) env(safe-area-inset-left);
  }
  #bar { width: 200px; height: 6px; background: rgba(255,255,255,0.18); border-radius: 2px; overflow: hidden; }
  #fill { width: 0; height: 100%; background: #7dfcff; transition: width 0.15s; }
  #hint { font-size: 13px; opacity: 0.85; text-shadow: 0 1px 2px #000; }
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="loading"><div id="bar"><div id="fill"></div></div><div id="hint">Loading…</div></div>
<script src="Build/{{{ LOADER_FILENAME }}}"></script>
<script>
  var canvas = document.querySelector("#unity-canvas");
  var loading = document.querySelector("#loading");
  var fill = document.querySelector("#fill");
  var hint = document.querySelector("#hint");
  var config = {
    arguments: [],
    dataUrl: "Build/{{{ DATA_FILENAME }}}",
    frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
    workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
    codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
    memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
    symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
    streamingAssetsUrl: "StreamingAssets",
    companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
    productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
    productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
  };
  ["touchstart", "touchmove", "touchend", "gesturestart", "contextmenu", "dblclick"].forEach(function (t) {
    document.addEventListener(t, function (e) { if (e.cancelable) e.preventDefault(); }, { passive: false });
  });
  var shownAt = Date.now(), minShowMs = 2000;
  createUnityInstance(canvas, config, function (p) {
    fill.style.width = Math.round(p * 100) + "%";
  }).then(function () {
    var wait = Math.max(0, minShowMs - (Date.now() - shownAt));
    setTimeout(function () { loading.style.display = "none"; }, wait);
  }).catch(function (message) {
    hint.textContent = message;
  });
</script>
</body>
</html>
